services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Credentials come from .env (git-ignored) — copy .env.example to .env and set POSTGRES_PASSWORD.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tripbyjkblabs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-tripbyjkblabs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tripbyjkblabs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      # this machine only; put a reverse proxy in front to reach it from elsewhere
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripbyjkblabs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tripbyjkblabs}
      NODE_ENV: production
      # Login (see README): a random 32+ character secret, and the hash from scripts/hash-password.mjs
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (see README)}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:-}
      # Optional — otherwise set on the Settings page:
      # IMMICH_URL: http://immich_server:2283
      # IMMICH_API_KEY: your_immich_api_key
    volumes:
      - receipts:/app/data/receipts # expense receipts (files)
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  receipts:
