name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start the app with a throwaway password and run the smoke test
        run: |
          export E2E_PASSWORD="ci-$(openssl rand -hex 12)"
          export SESSION_SECRET="$(openssl rand -hex 32)"
          export APP_PASSWORD_HASH="$(node -e '
            const {scryptSync,randomBytes}=require("crypto"); const s=randomBytes(16);
            console.log(["scrypt",16384,8,1,s.toString("hex"),scryptSync(process.argv[1],s,32,{N:16384,r:8,p:1}).toString("hex")].join(":"))' "$E2E_PASSWORD")"
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          (cd .next/standalone && NODE_ENV=production PORT=3000 HOSTNAME=127.0.0.1 node server.js > ../../server.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/api/health && break; sleep 1; done
          E2E_BASE_URL=http://localhost:3000 npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            server.log
          retention-days: 7
